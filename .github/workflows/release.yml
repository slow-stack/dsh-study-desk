name: Release to npm

# 手动触发，不跟 tag 推送自动联动：npm 上发出去的版本删不掉，
# 宁可多点一次按钮，也不要一个错手打歪的 tag 把包发出去。
# 用法：Actions → Release to npm → Run workflow → 选中要发的 tag（例如 v0.2.0）。
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # npm provenance / trusted publishing 要这个

jobs:
  publish:
    name: 发布
    runs-on: ubuntu-latest
    steps:
      # 不接任何输入做 ref：GitHub 在「Run workflow」里选好哪个 ref，这里就检出哪个
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'

      - name: 发之前先过一遍测试与冒烟
        run: |
          node --test
          node apply-probe.mjs

      - name: 确认版本号和 tag 对得上
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "package.json = v$VERSION"
          if [ "${GITHUB_REF_NAME#refs/tags/}" != "v$VERSION" ] && [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "::warning::当前 ref 是 $GITHUB_REF_NAME，和 package.json 的 $VERSION 不一致"
          fi

      - name: 要发的文件清单
        run: npm pack --dry-run

      # 免 token 发布：先在 npmjs.com 把 slow-stack/dsh-study-desk 配成 trusted publisher。
      # 想用 token：把上面那行换成 npm publish，再配 NPM_TOKEN secret，
      # 并在仓库里放一个 .npmrc 写 registry=https://registry.npmjs.org/ 与
      # //registry.npmjs.org/:_authToken 指向那个 secret（记得把 secret 加进 env）。
      - name: npm publish（带 provenance）
        # 不带 --no-git-checks：新版 npm 已经不认这个 flag，写了只会得一句
        # 「Unknown cli config "--git-checks"」然后照样忽略（AGENTS.md 里也记着别抄老命令）。
        run: npm publish --provenance --access public

      - name: 验证真的发上去了
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          # 注册表对新版本是异步的 —— npm publish 成功之后自己都会打一句
          # 「may take a few minutes to become available」。紧接着查必 404，
          # 会把一次明明成功的发布判成红（v0.7.0 就是这么红过一次：
          # publish 已经 + dsh-study-desk@0.7.0、provenance 也进了 transparency log）。
          for i in $(seq 1 12); do
            if npm view "$NAME@$VERSION" version dist.tarball; then
              echo "已上架：$NAME@$VERSION"
              exit 0
            fi
            echo "注册表还没同步（第 $i/12 次），等 15 秒再查"
            sleep 15
          done
          echo "::error::等了 3 分钟还查不到 $NAME@$VERSION。先别重发：去 npmjs.com 的包页面确认，"
          echo "   多半是已经发上去了、只是查询接口慢；真没上去再考虑本机直发（见 AGENTS.md 的发版一节）。"
          exit 1
