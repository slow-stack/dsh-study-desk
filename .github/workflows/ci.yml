name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: 单测与离线冒烟（node ${{ matrix.node }}）
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22.x', '24.x']
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      # 零运行时依赖，装都不用装；跑的就是发出去的那份代码
      - name: 数据层 / 番茄钟状态机 / 复习排期 / Markdown 往返
        run: node --test

      - name: 用 stub ctx 把宿主与客户端两侧 apply() 真跑一遍
        run: node apply-probe.mjs

      - name: 发布内容自检（files 白名单里的每个文件都得真进包）
        run: |
          # npm 的清单打在 stderr 上，不并过来 tee 到的是空文件
          npm pack --dry-run 2>&1 | tee pack.log
          # 不再钉死「total files: 12」——加一个源文件就得改一次数字，红得毫无信息。
          # 改成按 package.json 的 files 白名单逐个核对：少一个才是真问题。
          node -e "
          const { readFileSync } = require('node:fs');
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          const log = readFileSync('pack.log', 'utf8');
          const missing = [];
          for (const entry of pkg.files) {
            const probe = entry.replace(/\/$/, '');
            if (!log.includes(probe)) missing.push(entry);
          }
          if (missing.length) { console.error('包清单缺：' + missing.join(', ')); process.exit(1); }
          console.log('files 白名单 ' + pkg.files.length + ' 项全部进包');
          "

  portable:
    name: 可移植性检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # 见 AGENTS.md 的「坑 1」：patch 里写死某台机器的目录，别人装完直接起不来。
      # 只看真正的 name: 行 —— 文件里的注释本来就在讲这个 URL 形态。
      - name: cordis.patch.yml 必须是裸包名
        run: |
          grep -Eq '^[[:space:]]*name:[[:space:]]*dsh-study-desk[[:space:]]*$' cordis.patch.yml
          ! grep -Eq '^[[:space:]]*name:[[:space:]]*file://' cordis.patch.yml

      - name: 代码与文档里不许有本机用户目录
        run: |
          ! grep -rnE 'C:[\\]+Users|/home/[a-z0-9_]+' \
            --include='*.js' --include='*.mjs' --include='*.json' --include='*.md' --include='*.yml' .

      # 见 AGENTS.md 的「换行必须锁死」：工作区是 CRLF 时，本机 npm pack 与 CI 打包出来的
      # 字节不一样，同一个 tag 装出两份东西。.gitattributes 锁 LF，这条守着它别被悄悄破掉。
      - name: 工作区换行必须是 LF
        run: |
          # 只看 git 认定的文本文件：png 这类二进制自带 0x0D，用字节扫描会误报。
          # w/crlf 或 w/mixed 说明检出时被 core.autocrlf 改造过。
          if git ls-files --eol | grep -E 'w/(crlf|mixed)'; then
            echo '上面这些文件在工作区里是 CRLF，应为 LF：检查 .gitattributes 或重跑 git checkout -- .'
            exit 1
          fi
          echo '工作区换行全部是 LF'
